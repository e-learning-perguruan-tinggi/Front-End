<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Aljabar Linear & Matriks</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .quiz-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .quiz-header {
            background: linear-gradient(145deg, #4a90e2, #357abd);
            color: white;
            padding: 25px 30px;
            border-radius: 25px 25px 0 0;
            text-align: center;
            position: relative;
        }

        .quiz-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .quiz-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin: 0;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px;
            margin-top: 15px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            height: 8px;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .quiz-content {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
        }

        .question-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-number {
            color: #4a90e2;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 30px;
            line-height: 1.6;
            flex-grow: 1;
        }

        .math-formula {
            background: #f8f9fa;
            border-left: 4px solid #4a90e2;
            padding: 15px 20px;
            margin: 15px 0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
        }

        .options-container {
            margin-bottom: 30px;
        }

        .option-item {
            margin-bottom: 15px;
            position: relative;
        }

        .option-input {
            display: none;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 18px 25px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-label:hover {
            background: #e3f2fd;
            border-color: #4a90e2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.2);
        }

        .option-label.selected {
            background: linear-gradient(145deg, #4a90e2, #357abd);
            border-color: #357abd;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.3);
        }

        .option-label.correct {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            border-color: #27ae60;
            color: white;
        }

        .option-label.incorrect {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border-color: #c0392b;
            color: white;
        }

        .option-letter {
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 15px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .option-label.selected .option-letter,
        .option-label.correct .option-letter,
        .option-label.incorrect .option-letter {
            background: rgba(255, 255, 255, 0.3);
        }

        .option-text {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .result-icon {
            margin-left: 15px;
            font-size: 1.3rem;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .option-label.correct .result-icon,
        .option-label.incorrect .result-icon {
            opacity: 1;
            transform: scale(1);
        }

        .navigation-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #f1f3f4;
        }

        .nav-button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-previous {
            background: linear-gradient(145deg, #95a5a6, #7f8c8d);
            color: white;
        }

        .btn-previous:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(149, 165, 166, 0.4);
        }

        .btn-previous:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background: linear-gradient(145deg, #4a90e2, #357abd);
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-finish {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
        }

        .btn-finish:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .answer-status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .answer-status.show {
            opacity: 1;
            transform: translateY(0);
        }

        .answer-status.correct {
            background: rgba(46, 204, 113, 0.1);
            color: #27ae60;
            border: 2px solid rgba(46, 204, 113, 0.3);
        }

        .answer-status.incorrect {
            background: rgba(231, 76, 60, 0.1);
            color: #c0392b;
            border: 2px solid rgba(231, 76, 60, 0.3);
        }

        .results-container {
            text-align: center;
            padding: 40px 20px;
        }

        .results-title {
            font-size: 2.2rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            margin: 30px 0;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
            display: inline-block;
            min-width: 200px;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .score-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid #4a90e2;
        }

        .score-item h4 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .score-item .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4a90e2;
        }

        .restart-button {
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .restart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.4);
        }

        @media (max-width: 768px) {
            .quiz-container {
                padding: 10px;
            }

            .quiz-content {
                padding: 30px 20px;
            }

            .quiz-title {
                font-size: 1.5rem;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .option-label {
                padding: 15px 20px;
            }

            .option-text {
                font-size: 1rem;
            }

            .navigation-container {
                flex-direction: column;
                gap: 15px;
            }

            .nav-button {
                width: 100%;
                justify-content: center;
            }

            .score-display {
                font-size: 2.5rem;
                padding: 20px;
            }
        }

        /* Animasi masuk */
        .fade-in {
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-card fade-in" id="quizCard">
            <!-- Quiz Header -->
            <div class="quiz-header">
                <h1 class="quiz-title">Kuis Aljabar Linear & Matriks</h1>
                <p class="quiz-subtitle">Pilih jawaban yang paling tepat untuk setiap pertanyaan</p>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText">Pertanyaan 1 dari 8</div>
            </div>

            <!-- Quiz Content -->
            <div class="quiz-content" id="quizContent">
                <div class="question-container">
                    <div class="question-number" id="questionNumber">Pertanyaan 1</div>
                    <div class="question-text" id="questionText">
                        <!-- Question will be loaded here -->
                    </div>
                    
                    <div class="options-container" id="optionsContainer">
                        <!-- Options will be loaded here -->
                    </div>
                    
                    <div class="answer-status" id="answerStatus">
                        <!-- Answer feedback will appear here -->
                    </div>
                </div>

                <div class="navigation-container">
                    <button class="nav-button btn-previous" id="prevButton" onclick="previousQuestion()" disabled>
                        <i class="fas fa-arrow-left"></i>
                        Sebelumnya
                    </button>
                    
                    <button class="nav-button btn-next" id="nextButton" onclick="nextQuestion()" disabled>
                        Selanjutnya
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Database soal Aljabar Linear & Matriks
        const questions = [
            {
                id: 1,
                question: "Apa yang dimaksud dengan matriks identitas?",
                options: [
                    "Matriks yang semua elemennya bernilai 1",
                    "Matriks persegi yang elemen diagonal utamanya 1 dan elemen lainnya 0",
                    "Matriks yang determinannya sama dengan 1",
                    "Matriks yang tidak dapat diinvers"
                ],
                correctAnswer: 1, // Index B (mulai dari 0)
                explanation: "Matriks identitas adalah matriks persegi dimana elemen diagonal utama bernilai 1 dan semua elemen lainnya bernilai 0."
            },
            {
                id: 2,
                question: "Jika A adalah matriks 3×2 dan B adalah matriks 2×4, maka hasil perkalian A×B menghasilkan matriks berukuran:",
                options: [
                    "3×4",
                    "2×2", 
                    "3×2",
                    "Tidak dapat dikalikan"
                ],
                correctAnswer: 0, // Index A
                explanation: "Perkalian matriks A(m×n) × B(p×q) hanya bisa dilakukan jika n = p, dan hasilnya berukuran m×q. Jadi 3×2 × 2×4 = 3×4."
            },
            {
                id: 3,
                question: "Determinan dari matriks 2×2 berikut ini adalah:",
                formula: "A = [2  3]\n    [1  4]",
                options: [
                    "5",
                    "8", 
                    "11",
                    "14"
                ],
                correctAnswer: 0, // Index A
                explanation: "Determinan matriks 2×2 = ad - bc = (2×4) - (3×1) = 8 - 3 = 5."
            },
            {
                id: 4,
                question: "Suatu sistem persamaan linear homogen selalu memiliki:",
                options: [
                    "Solusi tunggal",
                    "Tidak ada solusi",
                    "Solusi trivial (x = 0)",
                    "Solusi tak hingga"
                ],
                correctAnswer: 2, // Index C
                explanation: "Sistem persamaan linear homogen (Ax = 0) selalu memiliki solusi trivial x = 0, dan mungkin memiliki solusi non-trivial lainnya."
            },
            {
                id: 5,
                question: "Vektor-vektor berikut yang membentuk basis untuk R² adalah:",
                options: [
                    "(1,2) dan (2,4)",
                    "(1,0) dan (0,1)",
                    "(3,6) dan (1,2)",
                    "(0,0) dan (1,1)"
                ],
                correctAnswer: 1, // Index B
                explanation: "Basis untuk R² harus terdiri dari 2 vektor yang linear independen. (1,0) dan (0,1) adalah basis standar untuk R²."
            },
            {
                id: 6,
                question: "Rank dari matriks adalah:",
                options: [
                    "Jumlah baris matriks",
                    "Jumlah kolom matriks",
                    "Jumlah maksimum baris atau kolom yang linear independen",
                    "Determinan matriks"
                ],
                correctAnswer: 2, // Index C
                explanation: "Rank matriks adalah jumlah maksimum baris (atau kolom) yang linear independen dalam matriks tersebut."
            },
            {
                id: 7,
                question: "Matriks A dapat diinvers jika dan hanya jika:",
                options: [
                    "A adalah matriks persegi",
                    "det(A) ≠ 0",
                    "A adalah matriks diagonal",
                    "Semua elemen A positif"
                ],
                correctAnswer: 1, // Index B
                explanation: "Matriks dapat diinvers jika dan hanya jika determinannya tidak sama dengan nol (det(A) ≠ 0)."
            },
            {
                id: 8,
                question: "Dalam transformasi linear T: R² → R², jika T(1,0) = (2,3) dan T(0,1) = (1,4), maka T(2,3) adalah:",
                options: [
                    "(7,18)",
                    "(5,12)",
                    "(4,9)",
                    "(3,7)"
                ],
                correctAnswer: 0, // Index A
                explanation: "T(2,3) = 2×T(1,0) + 3×T(0,1) = 2×(2,3) + 3×(1,4) = (4,6) + (3,12) = (7,18)."
            }
        ];

        // State management
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let isAnswered = false;
        let score = 0;
        let correctAnswers = 0;
        let quizCompleted = false;

        // Initialize quiz
        document.addEventListener('DOMContentLoaded', function() {
            initializeQuiz();
            displayQuestion();
        });

        function initializeQuiz() {
            userAnswers = new Array(questions.length).fill(-1);
            currentQuestionIndex = 0;
            isAnswered = false;
            score = 0;
            correctAnswers = 0;
            quizCompleted = false;
            updateProgress();
        }

        function displayQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question number and text
            document.getElementById('questionNumber').textContent = `Pertanyaan ${currentQuestionIndex + 1}`;
            
            let questionHTML = question.question;
            if (question.formula) {
                questionHTML += `<div class="math-formula">${question.formula}</div>`;
            }
            document.getElementById('questionText').innerHTML = questionHTML;

            // Create options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionElement = createOptionElement(option, index, question.id);
                optionsContainer.appendChild(optionElement);
            });

            // Update navigation buttons
            updateNavigationButtons();
            
            // Reset answer status
            document.getElementById('answerStatus').classList.remove('show', 'correct', 'incorrect');
            
            // Update progress
            updateProgress();
            
            // Add fade in animation
            document.getElementById('quizContent').classList.add('fade-in');
            
            // Reset answered state if returning to previous question
            isAnswered = userAnswers[currentQuestionIndex] !== -1;
            if (isAnswered) {
                showPreviousAnswer();
            }
        }

        function createOptionElement(optionText, index, questionId) {
            const optionDiv = document.createElement('div');
            optionDiv.className = 'option-item';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `question_${questionId}`;
            input.value = index;
            input.id = `option_${questionId}_${index}`;
            input.className = 'option-input';
            input.addEventListener('change', () => selectAnswer(index));

            const label = document.createElement('label');
            label.htmlFor = `option_${questionId}_${index}`;
            label.className = 'option-label';

            const letter = document.createElement('div');
            letter.className = 'option-letter';
            letter.textContent = String.fromCharCode(65 + index); // A, B, C, D

            const text = document.createElement('div');
            text.className = 'option-text';
            text.textContent = optionText;

            const icon = document.createElement('i');
            icon.className = 'result-icon fas';

            label.appendChild(letter);
            label.appendChild(text);
            label.appendChild(icon);

            optionDiv.appendChild(input);
            optionDiv.appendChild(label);

            return optionDiv;
        }

        function selectAnswer(selectedIndex) {
            if (isAnswered) return;

            const question = questions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedIndex;
            isAnswered = true;

            // Update UI to show selection
            const labels = document.querySelectorAll('.option-label');
            labels.forEach((label, index) => {
                if (index === selectedIndex) {
                    label.classList.add('selected');
                }
            });

            // Show answer feedback after a short delay
            setTimeout(() => {
                showAnswerFeedback(selectedIndex, question.correctAnswer);
            }, 500);

            // Enable next button
            document.getElementById('nextButton').disabled = false;
        }

        function showAnswerFeedback(selectedIndex, correctIndex) {
            const labels = document.querySelectorAll('.option-label');
            const icons = document.querySelectorAll('.result-icon');
            const answerStatus = document.getElementById('answerStatus');

            // Show correct answer
            labels[correctIndex].classList.add('correct');
            icons[correctIndex].classList.add('fa-check');

            // Show incorrect selection if different from correct
            if (selectedIndex !== correctIndex) {
                labels[selectedIndex].classList.add('incorrect');
                icons[selectedIndex].classList.add('fa-times');
                
                answerStatus.textContent = `Jawaban Salah! Jawaban yang benar adalah ${String.fromCharCode(65 + correctIndex)}.`;
                answerStatus.className = 'answer-status incorrect show';
            } else {
                answerStatus.textContent = 'Jawaban Benar! Excellent!';
                answerStatus.className = 'answer-status correct show';
                correctAnswers++;
            }

            // Show explanation
            setTimeout(() => {
                const explanation = document.createElement('div');
                explanation.style.marginTop = '10px';
                explanation.style.fontSize = '0.95rem';
                explanation.style.opacity = '0.8';
                explanation.textContent = questions[currentQuestionIndex].explanation;
                answerStatus.appendChild(explanation);
            }, 1000);
        }

        function showPreviousAnswer() {
            const selectedIndex = userAnswers[currentQuestionIndex];
            const correctIndex = questions[currentQuestionIndex].correctAnswer;
            
            if (selectedIndex !== -1) {
                // Check the previously selected option
                document.getElementById(`option_${questions[currentQuestionIndex].id}_${selectedIndex}`).checked = true;
                
                // Show the feedback immediately
                showAnswerFeedback(selectedIndex, correctIndex);
                
                // Enable next button
                document.getElementById('nextButton').disabled = false;
            }
        }

        function nextQuestion() {
            if (!isAnswered) {
                alert('Silakan pilih jawaban terlebih dahulu!');
                return;
            }

            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                isAnswered = false;
                displayQuestion();
            } else {
                finishQuiz();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function updateNavigationButtons() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');

            // Previous button
            prevButton.disabled = currentQuestionIndex === 0;

            // Next button
            if (currentQuestionIndex === questions.length - 1) {
                nextButton.textContent = 'Selesai';
                nextButton.innerHTML = '<i class="fas fa-check"></i> Selesai';
                nextButton.className = 'nav-button btn-finish';
            } else {
                nextButton.innerHTML = 'Selanjutnya <i class="fas fa-arrow-right"></i>';
                nextButton.className = 'nav-button btn-next';
            }

            nextButton.disabled = !isAnswered;
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Pertanyaan ${currentQuestionIndex + 1} dari ${questions.length}`;
        }

        function finishQuiz() {
            quizCompleted = true;
            score = Math.round((correctAnswers / questions.length) * 100);
            displayResults();
        }

        function displayResults() {
            const quizContent = document.getElementById('quizContent');
            
            let gradeText = '';
            let gradeColor = '';
            
            if (score >= 80) {
                gradeText = 'Excellent!';
                gradeColor = '#2ecc71';
            } else if (score >= 70) {
                gradeText = 'Good Job!';
                gradeColor = '#f39c12';
            } else if (score >= 60) {
                gradeText = 'Not Bad';
                gradeColor = '#e67e22';
            } else {
                gradeText = 'Need Improvement';
                gradeColor = '#e74c3c';
            }

            quizContent.innerHTML = `
                <div class="results-container fade-in">
                    <h2 class="results-title">Hasil Kuis Anda</h2>
                    <div class="score-display" style="background: linear-gradient(145deg, ${gradeColor}, ${gradeColor}dd)">
                        ${score}%<br>
                        <div style="font-size: 1rem; margin-top: 10px;">${gradeText}</div>
                    </div>
                    
                    <div class="score-details">
                        <div class="score-item">
                            <h4>Total Pertanyaan</h4>
                            <div class="number">${questions.length}</div>
                        </div>
                        <div class="score-item">
                            <h4>Jawaban Benar</h4>
                            <div class="number" style="color: #2ecc71">${correctAnswers}</div>
                        </div>
                        <div class="score-item">
                            <h4>Jawaban Salah</h4>
                            <div class="number" style="color: #e74c3c">${questions.length - correctAnswers}</div>
                        </div>
                        <div class="score-item">
                            <h4>Persentase</h4>
                            <div class="number" style="color: ${gradeColor}">${score}%</div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 30px;">
                        <h4 style="color: #2c3e50; margin-bottom: 20px;">Review Jawaban:</h4>
                        <div id="reviewContainer" style="text-align: left; max-width: 600px; margin: 0 auto;">
                            ${generateReviewHTML()}
                        </div>
                    </div>
                    
                    <button class="restart-button" onclick="restartQuiz()">
                        <i class="fas fa-redo"></i> Ulangi Kuis
                    </button>
                    
                    <button class="restart-button" onclick="backToCourseSelection()" style="background: linear-gradient(145deg, #34495e, #2c3e50); margin-left: 15px;">
                        <i class="fas fa-arrow-left"></i> Kembali ke Menu
                    </button>
                </div>
            `;
        }

        function generateReviewHTML() {
            let reviewHTML = '';
            
            questions.forEach((question, index) => {
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === question.correctAnswer;
                const statusIcon = isCorrect ? '<i class="fas fa-check" style="color: #2ecc71;"></i>' : '<i class="fas fa-times" style="color: #e74c3c;"></i>';
                const statusClass = isCorrect ? 'correct' : 'incorrect';
                
                reviewHTML += `
                    <div style="background: #f8f9fa; padding: 20px; margin-bottom: 15px; border-radius: 10px; border-left: 4px solid ${isCorrect ? '#2ecc71' : '#e74c3c'};">
                        <div style="display: flex; align-items: center; margin-bottom: 10px;">
                            ${statusIcon}
                            <strong style="margin-left: 10px;">Pertanyaan ${index + 1}</strong>
                        </div>
                        <div style="margin-bottom: 10px; font-size: 0.95rem;">${question.question}</div>
                        <div style="margin-bottom: 5px;">
                            <strong>Jawaban Anda:</strong> 
                            <span style="color: ${isCorrect ? '#2ecc71' : '#e74c3c'};">
                                ${userAnswer !== -1 ? String.fromCharCode(65 + userAnswer) + '. ' + question.options[userAnswer] : 'Tidak dijawab'}
                            </span>
                        </div>
                        ${!isCorrect ? `
                            <div style="margin-bottom: 5px;">
                                <strong>Jawaban Benar:</strong> 
                                <span style="color: #2ecc71;">
                                    ${String.fromCharCode(65 + question.correctAnswer)}. ${question.options[question.correctAnswer]}
                                </span>
                            </div>
                        ` : ''}
                        <div style="font-size: 0.9rem; color: #666; margin-top: 8px;">
                            <strong>Penjelasan:</strong> ${question.explanation}
                        </div>
                    </div>
                `;
            });
            
            return reviewHTML;
        }

        function restartQuiz() {
            if (confirm('Apakah Anda yakin ingin mengulang kuis? Semua jawaban akan dihapus.')) {
                // Reset all variables
                initializeQuiz();
                
                // Reset UI
                document.getElementById('quizContent').innerHTML = `
                    <div class="question-container">
                        <div class="question-number" id="questionNumber">Pertanyaan 1</div>
                        <div class="question-text" id="questionText">
                            <!-- Question will be loaded here -->
                        </div>
                        
                        <div class="options-container" id="optionsContainer">
                            <!-- Options will be loaded here -->
                        </div>
                        
                        <div class="answer-status" id="answerStatus">
                            <!-- Answer feedback will appear here -->
                        </div>
                    </div>

                    <div class="navigation-container">
                        <button class="nav-button btn-previous" id="prevButton" onclick="previousQuestion()" disabled>
                            <i class="fas fa-arrow-left"></i>
                            Sebelumnya
                        </button>
                        
                        <button class="nav-button btn-next" id="nextButton" onclick="nextQuestion()" disabled>
                            Selanjutnya
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                `;
                
                // Display first question
                displayQuestion();
            }
        }

        function backToCourseSelection() {
            if (confirm('Apakah Anda yakin ingin kembali ke menu pemilihan mata kuliah?')) {
                // In a real application, this would redirect to the course selection page
                // For demo purposes, we'll just reload the page or show an alert
                alert('Mengarahkan kembali ke halaman pemilihan mata kuliah...');
                // window.location.href = 'course-selection.html';
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (quizCompleted) return;
            
            // Number keys 1-4 for selecting options A-D
            if (e.key >= '1' && e.key <= '4' && !isAnswered) {
                const optionIndex = parseInt(e.key) - 1;
                const optionInput = document.querySelector(`input[value="${optionIndex}"]`);
                if (optionInput) {
                    optionInput.checked = true;
                    selectAnswer(optionIndex);
                }
            }
            
            // Arrow keys for navigation
            if (e.key === 'ArrowLeft' && currentQuestionIndex > 0) {
                previousQuestion();
            }
            
            if (e.key === 'ArrowRight' && isAnswered) {
                nextQuestion();
            }
            
            // Enter key for next question
            if (e.key === 'Enter' && isAnswered) {
                nextQuestion();
            }
            
            // Escape key for confirmation
            if (e.key === 'Escape') {
                if (confirm('Apakah Anda yakin ingin keluar dari kuis?')) {
                    backToCourseSelection();
                }
            }
        });

        // Auto-save functionality (for demo - in real app would save to server)
        function autoSave() {
            const quizData = {
                currentQuestionIndex,
                userAnswers,
                correctAnswers,
                timestamp: new Date().toISOString()
            };
            
            // In real application, save to server
            console.log('Auto-saving quiz progress:', quizData);
        }

        // Auto-save every 30 seconds
        setInterval(autoSave, 30000);

        // Prevent accidental page refresh
        window.addEventListener('beforeunload', function(e) {
            if (!quizCompleted && userAnswers.some(answer => answer !== -1)) {
                e.preventDefault();
                e.returnValue = 'Anda memiliki jawaban yang belum tersimpan. Yakin ingin meninggalkan halaman?';
            }
        });

        // Touch/swipe support for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', function(e) {
            if (quizCompleted) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchStartX - touchEndX;
            const diffY = Math.abs(touchStartY - touchEndY);
            
            // Only trigger swipe if horizontal movement is greater than vertical
            if (Math.abs(diffX) > 50 && diffY < 100) {
                if (diffX > 0 && isAnswered) {
                    // Swipe left - next question
                    nextQuestion();
                } else if (diffX < 0 && currentQuestionIndex > 0) {
                    // Swipe right - previous question
                    previousQuestion();
                }
            }
        });

        // Performance optimization - preload next question
        function preloadNextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                // Preload images or heavy content for next question if any
                // This is just a placeholder for demonstration
                console.log(`Preloading question ${currentQuestionIndex + 2}`);
            }
        }

        // Call preload when answer is selected
        function selectAnswer(selectedIndex) {
            if (isAnswered) return;

            const question = questions[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedIndex;
            isAnswered = true;

            // Update UI to show selection
            const labels = document.querySelectorAll('.option-label');
            labels.forEach((label, index) => {
                if (index === selectedIndex) {
                    label.classList.add('selected');
                }
            });

            // Show answer feedback after a short delay
            setTimeout(() => {
                showAnswerFeedback(selectedIndex, question.correctAnswer);
                preloadNextQuestion(); // Preload next question
            }, 500);

            // Enable next button
            document.getElementById('nextButton').disabled = false;
        }

        // Analytics tracking (for demo purposes)
        function trackQuizEvent(eventName, data) {
            console.log('Quiz Event:', eventName, data);
            // In real application, send to analytics service
        }

        // Track quiz start
        trackQuizEvent('quiz_started', {
            subject: 'Aljabar Linear & Matriks',
            totalQuestions: questions.length,
            timestamp: new Date().toISOString()
        });

        // Track question view
        function trackQuestionView(questionIndex) {
            trackQuizEvent('question_viewed', {
                questionNumber: questionIndex + 1,
                questionId: questions[questionIndex].id,
                timestamp: new Date().toISOString()
            });
        }

        // Track answer selection
        function trackAnswerSelection(questionIndex, selectedAnswer, isCorrect) {
            trackQuizEvent('answer_selected', {
                questionNumber: questionIndex + 1,
                questionId: questions[questionIndex].id,
                selectedAnswer: selectedAnswer,
                correctAnswer: questions[questionIndex].correctAnswer,
                isCorrect: isCorrect,
                timestamp: new Date().toISOString()
            });
        }

        // Enhanced displayQuestion with tracking
        function displayQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Track question view
            trackQuestionView(currentQuestionIndex);
            
            // Update question number and text
            document.getElementById('questionNumber').textContent = `Pertanyaan ${currentQuestionIndex + 1}`;
            
            let questionHTML = question.question;
            if (question.formula) {
                questionHTML += `<div class="math-formula">${question.formula}</div>`;
            }
            document.getElementById('questionText').innerHTML = questionHTML;

            // Create options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionElement = createOptionElement(option, index, question.id);
                optionsContainer.appendChild(optionElement);
            });

            // Update navigation buttons
            updateNavigationButtons();
            
            // Reset answer status
            document.getElementById('answerStatus').classList.remove('show', 'correct', 'incorrect');
            
            // Update progress
            updateProgress();
            
            // Add fade in animation
            document.getElementById('quizContent').classList.add('fade-in');
            
            // Reset answered state if returning to previous question
            isAnswered = userAnswers[currentQuestionIndex] !== -1;
            if (isAnswered) {
                showPreviousAnswer();
            }
        }

        // Enhanced selectAnswer with tracking
        function selectAnswer(selectedIndex) {
            if (isAnswered) return;

            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correctAnswer;
            
            userAnswers[currentQuestionIndex] = selectedIndex;
            isAnswered = true;

            // Track answer selection
            trackAnswerSelection(currentQuestionIndex, selectedIndex, isCorrect);

            // Update UI to show selection
            const labels = document.querySelectorAll('.option-label');
            labels.forEach((label, index) => {
                if (index === selectedIndex) {
                    label.classList.add('selected');
                }
            });

            // Show answer feedback after a short delay
            setTimeout(() => {
                showAnswerFeedback(selectedIndex, question.correctAnswer);
                preloadNextQuestion();
            }, 500);

            // Enable next button
            document.getElementById('nextButton').disabled = false;
        }

        // Track quiz completion
        function finishQuiz() {
            quizCompleted = true;
            score = Math.round((correctAnswers / questions.length) * 100);
            
            // Track quiz completion
            trackQuizEvent('quiz_completed', {
                subject: 'Aljabar Linear & Matriks',
                totalQuestions: questions.length,
                correctAnswers: correctAnswers,
                score: score,
                timeSpent: Date.now() - startTime,
                timestamp: new Date().toISOString()
            });
            
            displayResults();
        }

        // Track start time
        const startTime = Date.now();

        // Accessibility improvements
        document.addEventListener('DOMContentLoaded', function() {
            // Add ARIA labels for screen readers
            document.getElementById('progressBar').setAttribute('role', 'progressbar');
            document.getElementById('progressBar').setAttribute('aria-valuenow', '0');
            document.getElementById('progressBar').setAttribute('aria-valuemin', '0');
            document.getElementById('progressBar').setAttribute('aria-valuemax', '100');
            
            // Add keyboard focus indicators
            const style = document.createElement('style');
            style.textContent = `
                .option-label:focus-within {
                    outline: 3px solid #4a90e2;
                    outline-offset: 2px;
                }
                .nav-button:focus {
                    outline: 3px solid #4a90e2;
                    outline-offset: 2px;
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
