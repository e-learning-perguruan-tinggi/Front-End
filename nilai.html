<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Mahasiswa - Sistem Akademik</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #B6D0EF;
            --secondary-blue: #63A3F1;
            --light-cream: #FAFFEE;
            --dark-teal: #4F8A9E;
            --white: #FFFFFF;
            --grade-a: #28a745;
            --grade-b: #17a2b8;
            --grade-c: #ffc107;
            --grade-d: #fd7e14;
            --grade-e: #dc3545;
        }

        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-card {
            background: linear-gradient(135deg, var(--secondary-blue), var(--dark-teal));
            border-radius: 25px;
            padding: 2rem;
            margin-bottom: 2rem;
            color: var(--white);
            box-shadow: 0 15px 35px rgba(79, 138, 158, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="30" r="1.5" fill="rgba(255,255,255,0.1)"/><circle cx="60" cy="70" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="30" cy="80" r="1.5" fill="rgba(255,255,255,0.1)"/></svg>');
        }

        .back-button {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--dark-teal);
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 50px;
            padding: 12px 24px;
            margin-bottom: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            position: relative;
            z-index: 2;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            color: var(--dark-teal);
            text-decoration: none;
        }

        .student-info {
            position: relative;
            z-index: 1;
        }

        .student-info h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .student-info p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .ipk-container {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .ipk-display {
            text-align: center;
        }

        .ipk-number {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--white);
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 0.5rem;
            display: block;
        }

        .ipk-label {
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .grades-container {
            background: var(--white);
            border-radius: 25px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(79, 138, 158, 0.2);
            margin-bottom: 2rem;
        }

        .section-title {
            color: var(--dark-teal);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .subject-card {
            background: var(--light-cream);
            border-radius: 20px;
            padding: 1.5rem;
            border: 2px solid transparent;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary-blue), var(--dark-teal));
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .subject-card:hover::before {
            transform: scaleX(1);
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary-blue);
            box-shadow: 0 15px 30px rgba(99, 163, 241, 0.2);
        }

        .subject-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .subject-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--secondary-blue), var(--dark-teal));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .subject-info h4 {
            color: var(--dark-teal);
            font-weight: 700;
            margin-bottom: 0.25rem;
            font-size: 1.1rem;
        }

        .subject-info .credits {
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .grade-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
        }

        .grade-badge {
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--white);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            min-width: 60px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .grade-a { background: linear-gradient(135deg, var(--grade-a), #20c997); }
        .grade-b { background: linear-gradient(135deg, var(--grade-b), #20c997); }
        .grade-c { background: linear-gradient(135deg, var(--grade-c), #ffca2c); }
        .grade-d { background: linear-gradient(135deg, var(--grade-d), #ff922b); }
        .grade-e { background: linear-gradient(135deg, var(--grade-e), #e55353); }

        .grade-points {
            color: var(--dark-teal);
            font-weight: 600;
            font-size: 1rem;
        }

        .semester-info {
            background: linear-gradient(135deg, rgba(99, 163, 241, 0.1), rgba(79, 138, 158, 0.1));
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(99, 163, 241, 0.2);
        }

        .semester-info h5 {
            color: var(--dark-teal);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .semester-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            text-align: center;
        }

        .stat-item {
            background: var(--white);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary-blue);
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }

        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stagger-animation {
            animation-delay: 0.1s;
        }

        .stagger-animation:nth-child(2) { animation-delay: 0.2s; }
        .stagger-animation:nth-child(3) { animation-delay: 0.3s; }
        .stagger-animation:nth-child(4) { animation-delay: 0.4s; }
        .stagger-animation:nth-child(5) { animation-delay: 0.5s; }
        .stagger-animation:nth-child(6) { animation-delay: 0.6s; }
        .stagger-animation:nth-child(7) { animation-delay: 0.7s; }
        .stagger-animation:nth-child(8) { animation-delay: 0.8s; }

        @media (max-width: 768px) {
            .subjects-grid {
                grid-template-columns: 1fr;
            }
            
            .ipk-number {
                font-size: 2.5rem;
            }
            
            .header-card {
                padding: 1.5rem;
            }
            
            .grades-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header dengan Info Mahasiswa dan IPK -->
        <div class="header-card animate-fade-in">
            <a href="dash-mahasiswa.html" class="back-button">
                <i class="fas fa-arrow-left"></i>
                Kembali ke Dashboard
            </a>
            
            <div class="student-info">
                <h2><i class="fas fa-user-graduate me-2"></i>Aulia Resty Nur Aini</h2>
                <p><i class="fas fa-id-card me-2"></i>NIM: 23.11.5571</p>
                <p><i class="fas fa-graduation-cap me-2"></i>Teknik Informatika - Semester 4</p>
                
                <div class="ipk-container">
                    <div class="ipk-display">
                        <span class="ipk-number" id="ipkDisplay">3.98</span>
                        <div class="ipk-label">Indeks Prestasi Kumulatif</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Info Semester -->
        <div class="semester-info animate-fade-in">
            <h5><i class="fas fa-calendar-alt me-2"></i>Semester Genap 2025/2026</h5>
            <div class="semester-stats">
                <div class="stat-item">
                    <span class="stat-number">8</span>
                    <div class="stat-label">Mata Kuliah</div>
                </div>
                <div class="stat-item">
                    <span class="stat-number">20</span>
                    <div class="stat-label">Total SKS</div>
                </div>
                <div class="stat-item">
                    <span class="stat-number">3.72</span>
                    <div class="stat-label">IPS Semester</div>
                </div>
            </div>
        </div>

        <!-- Daftar Nilai -->
        <div class="grades-container animate-fade-in">
            <h3 class="section-title">
                <i class="fas fa-chart-line"></i>
                Daftar Nilai Mata Kuliah
            </h3>
            
            <div class="subjects-grid" id="subjectsGrid">
                <!-- Mata kuliah akan diisi oleh JavaScript -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Data mata kuliah
        const subjects = [
            {
                name: "Aljabar Linear & Matriks",
                credits: 3,
                grade: "A",
                points: 4.0,
                icon: "fas fa-square-root-alt"
            },
            {
                name: "Pemrograman Web",
                credits: 3,
                grade: "A",
                points: 4.0,
                icon: "fas fa-globe"
            },
            {
                name: "Analisis Desain",
                credits: 2,
                grade: "B+",
                points: 3.5,
                icon: "fas fa-pencil-ruler"
            },
            {
                name: "Multimedia",
                credits: 3,
                grade: "A-",
                points: 3.7,
                icon: "fas fa-photo-video"
            },
            {
                name: "Big Data",
                credits: 3,
                grade: "B+",
                points: 3.5,
                icon: "fas fa-database"
            },
            {
                name: "Kecerdasan Buatan",
                credits: 3,
                grade: "A",
                points: 4.0,
                icon: "fas fa-brain"
            },
            {
                name: "Basis Data",
                credits: 2,
                grade: "B",
                points: 3.0,
                icon: "fas fa-server"
            },
            {
                name: "Mikrokontroler",
                credits: 1,
                grade: "A-",
                points: 3.7,
                icon: "fas fa-microchip"
            }
        ];

        // Fungsi untuk mendapatkan class CSS berdasarkan grade
        function getGradeClass(grade) {
            if (grade.startsWith('A')) return 'grade-a';
            if (grade.startsWith('B')) return 'grade-b';
            if (grade.startsWith('C')) return 'grade-c';
            if (grade.startsWith('D')) return 'grade-d';
            return 'grade-e';
        }

        // Fungsi untuk menghitung IPK
        function calculateGPA() {
            let totalPoints = 0;
            let totalCredits = 0;
            
            subjects.forEach(subject => {
                totalPoints += subject.points * subject.credits;
                totalCredits += subject.credits;
            });
            
            return (totalPoints / totalCredits).toFixed(2);
        }

        // Render mata kuliah
        function renderSubjects() {
            const container = document.getElementById('subjectsGrid');
            
            subjects.forEach((subject, index) => {
                const subjectCard = document.createElement('div');
                subjectCard.className = 'subject-card animate-fade-in stagger-animation';
                
                subjectCard.innerHTML = `
                    <div class="subject-header">
                        <div class="subject-icon">
                            <i class="${subject.icon}"></i>
                        </div>
                        <div class="subject-info">
                            <h4>${subject.name}</h4>
                            <div class="credits">${subject.credits} SKS</div>
                        </div>
                    </div>
                    <div class="grade-display">
                        <div class="grade-badge ${getGradeClass(subject.grade)}">
                            ${subject.grade}
                        </div>
                        <div class="grade-points">
                            ${subject.points} poin
                        </div>
                    </div>
                `;
                
                container.appendChild(subjectCard);
            });
        }

        // Animasi counter untuk IPK
        function animateIPK() {
            const ipkElement = document.getElementById('ipkDisplay');
            const targetIPK = calculateGPA();
            let currentIPK = 0;
            const increment = targetIPK / 100;
            
            const timer = setInterval(() => {
                currentIPK += increment;
                if (currentIPK >= targetIPK) {
                    currentIPK = targetIPK;
                    clearInterval(timer);
                }
                ipkElement.textContent = currentIPK.toFixed(2);
            }, 20);
        }

        // Inisialisasi halaman
        document.addEventListener('DOMContentLoaded', function() {
            renderSubjects();
            setTimeout(animateIPK, 500);
        });
    </script>
</body>
</html>
